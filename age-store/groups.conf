# Secret access groups for age-encrypted secrets.
#
# Each line:   <group> = <key-name> <key-name> ...
# where each <key-name> refers to keys/<key-name>.pub in this store.
#
# A device joins a group by having its key name listed here. A key string
# is written exactly once (in keys/<name>.pub); groups reference it by name,
# so rotating a key touches one file and adding a device touches one line.
#
# After editing this file, re-encrypt the affected repos:
#     age-reencrypt <repo-dir>      # run from a device already in the group
#
# See README.md for the full model and flows.

# corp     — work secrets. Lives on the laptop, the agents box (root), and the
#            globe-dev corp container (which needs them for VPN/Vault/ivy).
corp     = laptop-dotdashmdp box-root globe-dev-pinc

# personal — personal secrets. Laptop only for now; add phone/other devices
#            here (and to keys/) when they exist. Deliberately NOT the corp
#            container, so it never holds personal key material.
personal = laptop-dotdashmdp
